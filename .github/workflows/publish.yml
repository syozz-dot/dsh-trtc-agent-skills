name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Verify npm version
        run: npm --version

      - name: Install rsync
        run: sudo apt-get install -y rsync

      # prepack hook runs scripts/sync-deps.sh, which pulls the pinned
      # Tencent-RTC/agent-skills release tag content into assets/trtc.
      - name: Publish to npm
        run: npm publish
